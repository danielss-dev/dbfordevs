[workspace]
resolver = "2"
members = [
    "src-tauri",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
authors = ["Daniels"]
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

