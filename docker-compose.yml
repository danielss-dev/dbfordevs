services:
  # PostgreSQL - Port 5432
  postgres:
    image: postgres:16
    container_name: dbfordevs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MySQL - Port 3306
  mysql:
    image: mysql:8
    container_name: dbfordevs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MariaDB - Port 3307
  mariadb:
    image: mariadb:11
    container_name: dbfordevs-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Microsoft SQL Server - Port 1433
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbfordevs-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MSSQL Init - runs sample data after MSSQL is ready
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbfordevs-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./docker/mssql-init:/init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for MSSQL to be ready..."
        sleep 5
        echo "Running init script..."
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P Password123 -C -i /init/01-sample-data.sql
        echo "Init complete!"
    restart: "no"

  # CockroachDB - Port 26257 (SQL), 8080 (Admin UI)
  cockroachdb:
    image: cockroachdb/cockroach:latest
    container_name: dbfordevs-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # CockroachDB Init - runs sample data after CockroachDB is ready
  cockroachdb-init:
    image: cockroachdb/cockroach:latest
    container_name: dbfordevs-cockroachdb-init
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./docker/cockroach-init:/init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for CockroachDB to be ready..."
        sleep 5
        echo "Running init script..."
        /cockroach/cockroach sql --insecure --host=cockroachdb < /init/01-sample-data.sql
        echo "Init complete!"
    restart: "no"

  # Oracle Database Free - Port 1521
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: dbfordevs-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: testuser
      APP_USER_PASSWORD: testuser
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Oracle Init - runs sample data after Oracle is ready
  oracle-init:
    image: gvenzl/oracle-free:23-slim
    container_name: dbfordevs-oracle-init
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ./docker/oracle-init:/init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Oracle to be ready..."
        sleep 10
        echo "Running init script..."
        sqlplus testuser/testuser@//oracle:1521/FREEPDB1 @/init/01-sample-data.sql
        echo "Init complete!"
    restart: "no"

  # Redis - Port 6379
  redis:
    image: redis:7-alpine
    container_name: dbfordevs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Init - loads sample data after Redis is ready
  redis-init:
    image: redis:7-alpine
    container_name: dbfordevs-redis-init
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docker/redis-init:/init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Loading Redis sample data..."
        redis-cli -h redis < /init/01-sample-data.redis
        echo "Redis init complete!"
    restart: "no"

  # MongoDB - Port 27017
  mongodb:
    image: mongo:7
    container_name: dbfordevs-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongodb
      MONGO_INITDB_DATABASE: testdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  mysql_data:
  mariadb_data:
  mssql_data:
  cockroach_data:
  oracle_data:
  redis_data:
  mongodb_data:
