services:
  # PostgreSQL - Port 5432
  postgres:
    image: postgres:16
    container_name: dbfordevs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  # MySQL - Port 3306
  mysql:
    image: mysql:8
    container_name: dbfordevs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d

  # MariaDB - Port 3307
  mariadb:
    image: mariadb:11
    container_name: dbfordevs-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d

  # Microsoft SQL Server - Port 1433
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbfordevs-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # CockroachDB - Port 26257 (SQL), 8080 (Admin UI)
  cockroachdb:
    image: cockroachdb/cockroach:latest
    container_name: dbfordevs-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data

volumes:
  postgres_data:
  mysql_data:
  mariadb_data:
  mssql_data:
  cockroach_data:
