[package]
name = "dbfordevs"
version = "0.3.2"
description = "A modern cross-platform database management application for developers"
authors = ["Daniels"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
arboard = "3.4.1"

# Database drivers
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "time",
    "rust_decimal",
    "mac_address",
    "ipnetwork",
    "bit-vec",
    "json"
] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
deadpool = { version = "0.12", features = ["managed"] }
oracle = { version = "0.6", features = ["chrono"] }

# CSV parsing
csv = "1.3"

# Utilities
dirs = "5"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# HTTP client for downloads
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
zip = "2.1"

# SSH tunneling
russh = "0.46"
russh-keys = "0.46"

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mysql"] }
tokio-test = "0.4"
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

