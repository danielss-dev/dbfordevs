name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun install

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || '' }}

      # Windows Authenticode (docs/windows-signing.md): Tauri signs
      # dbfordevs.exe, the MSI and the NSIS installer through
      # scripts/windows-sign.ps1.
      - name: windows signing client
        id: winsign
        if: matrix.platform == 'windows-latest' && vars.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: ./scripts/windows-signing-client.ps1

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ steps.winsign.outcome == 'success' && secrets.AZURE_SIGNING_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ steps.winsign.outcome == 'success' && secrets.AZURE_SIGNING_TENANT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.winsign.outcome == 'success' && secrets.AZURE_SIGNING_CLIENT_SECRET || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Release v__VERSION__"
          releaseBody: "See the assets below for the latest version."
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ steps.winsign.outputs.tauri_args || (matrix.platform == 'ubuntu-22.04' && '--target x86_64-unknown-linux-gnu' || '') }}

      - name: verify windows signatures
        if: steps.winsign.outcome == 'success'
        shell: pwsh
        run: |
          # The installers, and every executable the MSI installs (an
          # administrative install unpacks it without running it).
          $files = @(Get-ChildItem target/release/bundle/msi -Filter '*.msi') + @(Get-ChildItem target/release/bundle/nsis -Filter '*.exe')
          if (!$files.Count) { throw 'No Windows installers found.' }
          foreach ($msi in @($files | Where-Object Extension -eq '.msi')) {
            $unpacked = Join-Path $env:RUNNER_TEMP "msi-$($msi.BaseName)"
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$unpacked`"")
            if ($process.ExitCode -ne 0) { throw "Could not unpack $($msi.Name): $($process.ExitCode)" }
            $files += @(Get-ChildItem $unpacked -Recurse -Filter '*.exe')
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature is $($signature.Status): $($signature.StatusMessage)" }
            Write-Host "$($file.Name): $($signature.SignerCertificate.Subject)"
          }

